server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Cache hashed assets aggressively
  location /static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback — every unknown path returns index.html
  location / {
    try_files $uri /index.html;
  }

  # Service worker must not be cached so updates ship instantly
  location = /service-worker.js {
    add_header Cache-Control "no-cache";
    expires off;
    try_files $uri =404;
  }

  # gzip
  gzip on;
  gzip_types text/plain text/css application/json application/javascript application/xml+rss image/svg+xml;
}
